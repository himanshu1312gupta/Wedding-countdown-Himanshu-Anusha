<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Himanshu & Anusha - Save The Date</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cinzel:wght@400;600&family=Playfair+Display:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
/* ⚙️ BASE & RESET */
* { margin:0; padding:0; box-sizing:border-box; }
body {
    color: #FFF8E7;
    font-family: 'Playfair Display', serif;
    overflow: hidden;
    background-color: #050505;
}

/* 🎬 VIDEO BACKGROUND */
video {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    z-index: -4;
    transform: scale(1.05);
    animation: zoomVideo 30s ease-in-out infinite alternate;
}
@keyframes zoomVideo { from { transform: scale(1.05); } to { transform: scale(1.15); } }

/* 🔥 DYNAMIC OVERLAYS */
.overlay {
    position: fixed; width: 100%; height: 100%;
    background: radial-gradient(circle at center, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.8) 100%);
    z-index: -3;
}

/* ✨ CANVAS STARDUST (Background) */
canvas#stardust {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: -2;
    pointer-events: none;
}

/* 💎 GLASSMORPHISM CONTAINER */
.container {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}
.glass-card {
    background: linear-gradient(135deg, rgba(30, 20, 20, 0.4), rgba(10, 5, 5, 0.6));
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 215, 0, 0.2);
    border-radius: 24px;
    padding: 50px 40px;
    text-align: center;
    box-shadow: 0 30px 60px rgba(0,0,0,0.6), inset 0 0 20px rgba(255,215,0,0.05);
    max-width: 650px;
    width: 100%;
    z-index: 10;
}

/* 🎭 STAGGERED ANIMATIONS (Wrappers) */
.animate-in { 
    opacity: 0; 
    transform: translateY(40px); 
}
body.loaded .animate-in {
    animation: fadeUp 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
}

@keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
}
.delay-1 { animation-delay: 0.2s; }
.delay-2 { animation-delay: 0.5s; }
.delay-3 { animation-delay: 0.8s; }
.delay-4 { animation-delay: 1.1s; }
.delay-5 { animation-delay: 1.4s; }
.delay-6 { animation-delay: 1.7s; }
.delay-7 { animation-delay: 2.0s; }

/* ✨ GLARE EFFECT FOR TEXTS */
.glare-text {
    background: linear-gradient(120deg, #FFD700 20%, #FFFFFF 40%, #FFD700 60%);
    background-size: 200% auto;
    color: transparent;
    -webkit-background-clip: text;
    background-clip: text;
    animation: shineGlare 4s linear infinite;
    text-shadow: 0 2px 10px rgba(255, 215, 0, 0.3);
}
.glare-white {
    background: linear-gradient(120deg, rgba(255,255,255,0.8) 20%, #FFFFFF 40%, rgba(255,255,255,0.8) 60%);
    background-size: 200% auto;
    color: transparent;
    -webkit-background-clip: text;
    background-clip: text;
    animation: shineGlare 5s linear infinite;
}
@keyframes shineGlare {
    to { background-position: 200% center; }
}

/* 🖋️ TYPOGRAPHY */
.title {
    font-family: 'Cinzel', serif; font-size: 1.2rem; letter-spacing: 6px; text-transform: uppercase;
    margin-bottom: 10px;
}
.subtitle {
    font-family: 'Playfair Display', serif; font-size: 1.1rem; font-style: italic;
    color: rgba(255, 255, 255, 0.8); margin-bottom: 25px; letter-spacing: 1px;
}

/* 👑 NAMES & SPRINKLER CANVAS */
.names { 
    display: flex; flex-direction: column; align-items: center; 
    line-height: 1.1; margin-bottom: 25px;
    position: relative;
}
#sprinkler-canvas {
    position: absolute;
    top: -20px; left: -50px; right: -50px; bottom: -50px;
    width: calc(100% + 100px);
    height: calc(100% + 70px);
    pointer-events: none;
    z-index: 5;
}
.name-text {
    font-family: 'Great Vibes', cursive; font-size: 5rem;
    background: linear-gradient(45deg, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C);
    background-size: 200% auto; color: transparent;
    -webkit-background-clip: text; background-clip: text;
    animation: shineGlare 5s linear infinite; text-shadow: 0 5px 20px rgba(255, 215, 0, 0.2);
    position: relative; z-index: 2;
}
.ampersand { font-family: 'Cinzel', serif; font-size: 1.5rem; color: #FFD700; margin: 5px 0; position: relative; z-index: 2; }
.date { font-family: 'Cinzel', serif; font-size: 1.6rem; letter-spacing: 2px; margin-bottom: 20px; }

/* 🌿 DIVIDER */
.divider { display: flex; align-items: center; justify-content: center; margin: 25px 0; opacity: 0.8; }
.divider::before, .divider::after { content: ''; width: 80px; height: 1px; background: linear-gradient(to right, transparent, #FFD700, transparent); }
.divider svg { fill: #FFD700; width: 22px; margin: 0 20px; filter: drop-shadow(0 0 5px rgba(255,215,0,0.5)); }

/* ⏳ PREMIUM COUNTDOWN */
.countdown-wrapper { display: flex; justify-content: center; gap: 15px; margin: 20px 0; }
.time-box {
    background: rgba(255, 215, 0, 0.03); border: 1px solid rgba(255, 215, 0, 0.15);
    border-radius: 12px; padding: 15px 10px; width: 85px;
    display: flex; flex-direction: column; align-items: center;
    transition: all 0.4s ease;
}
.time-box:hover { background: rgba(255, 215, 0, 0.1); border-color: rgba(255, 215, 0, 0.5); }
.time-box span.number { 
    font-family: 'Cinzel', serif; 
    font-size: 2.2rem; 
    font-weight: 600; 
    display: inline-block; 
}
.time-box span.label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; margin-top: 5px; color: rgba(255, 255, 255, 0.6); }

/* 🎞️ SWIPING EFFECT FOR COUNTDOWN NUMBERS */
.swipe-down {
    animation: swipeDownAnim 0.4s cubic-bezier(0.4, 0.0, 0.2, 1) forwards;
}
@keyframes swipeDownAnim {
    0% { transform: translateY(0) scale(1); opacity: 1; }
    45% { transform: translateY(15px) scale(0.8); opacity: 0; }
    50% { transform: translateY(-15px) scale(0.8); opacity: 0; }
    100% { transform: translateY(0) scale(1); opacity: 1; }
}

/* ❤️ LOVE QUOTE */
.quote {
    font-family: 'Playfair Display', serif; font-style: italic; font-size: 1.15rem;
    margin-top: 30px; padding: 0 20px; line-height: 1.6;
}
.quote span { font-weight: 600; }

/* 🎵 AUDIO BTN */
.audio-btn {
    position: fixed; bottom: 30px; right: 30px; width: 55px; height: 55px;
    border-radius: 50%; background: rgba(20,20,20,0.5); border: 1px solid rgba(255,215,0,0.3);
    backdrop-filter: blur(10px); display: flex; justify-content: center; align-items: center;
    z-index: 100; transition: all 0.4s ease; cursor: pointer;
}
.audio-btn:hover { background: rgba(255,215,0,0.2); border-color: rgba(255,215,0,0.8); }
.audio-btn svg { width: 22px; fill: #FFD700; }

/* 📱 RESPONSIVE */
@media(max-width:768px) {
    .name-text { font-size: 3.8rem; }
    .date { font-size: 1.3rem; }
    .countdown-wrapper { gap: 10px; }
    .time-box { width: 70px; padding: 12px 5px; }
    .time-box span.number { font-size: 1.6rem; }
    .glass-card { padding: 40px 20px; }
    .quote { font-size: 1rem; }
}
</style>
</head>

<body>

<!-- VIDEO & OVERLAYS -->
<video autoplay muted loop playsinline>
    <source src="https://cdn.coverr.co/videos/coverr-couple-in-love-5176/1080p.mp4" type="video/mp4">
</video>
<div class="overlay"></div>

<!-- CANVAS STARDUST (Background) -->
<canvas id="stardust"></canvas>

<!-- AUDIO CONTROLLER -->
<audio id="bg-music" loop>
    <source src="YOUR_AUDIO_FILE.mp3" type="audio/mpeg">
</audio>
<div class="audio-btn" id="audio-toggle">
    <svg id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    <svg id="icon-pause" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
</div>

<!-- MAIN CONTENT -->
<div class="container">
    <div class="glass-card">
        
        <!-- WRAPPED TEXTS TO PREVENT ANIMATION CONFLICTS -->
        <div class="animate-in delay-1">
            <div class="title glare-text">Save The Date</div>
        </div>
        
        <div class="animate-in delay-2">
            <div class="subtitle">For the wedding of</div>
        </div>
        
        <!-- NAMES WITH SUBTLE STAR SPRINKLER EFFECT -->
        <div class="names animate-in delay-3">
            <canvas id="sprinkler-canvas"></canvas>
            <div class="name-text">Himanshu</div>
            <div class="ampersand">&</div>
            <div class="name-text">Anusha</div>
        </div>
        
        <div class="animate-in delay-4">
            <div class="date glare-white">25 November 2026</div>
        </div>
        
        <div class="divider animate-in delay-5">
            <svg viewBox="0 0 24 24"><path d="M12 2L2 12l10 10 10-10L12 2zm0 17.5L4.5 12 12 4.5 19.5 12 12 19.5z"/></svg>
        </div>
        
        <div class="countdown-wrapper animate-in delay-6">
            <div class="time-box"><span class="number glare-text" id="days">000</span><span class="label">Days</span></div>
            <div class="time-box"><span class="number glare-text" id="hours">00</span><span class="label">Hours</span></div>
            <div class="time-box"><span class="number glare-text" id="minutes">00</span><span class="label">Mins</span></div>
            <div class="time-box"><span class="number glare-text" id="seconds">00</span><span class="label">Secs</span></div>
        </div>

        <div class="animate-in delay-7">
            <div class="quote glare-white">
                "A beautiful journey begins where <span class="glare-text">two hearts</span> become one."
            </div>
        </div>

    </div>
</div>

<script>
/* --- FAIL-SAFE PRELOADER LOGIC --- */
let isLoaded = false;
// Using DOMContentLoaded instead of 'load' ensures text appears immediately 
// without waiting for the video to fully buffer.
window.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => {
        document.body.classList.add('loaded');
        isLoaded = true;
    }, 200); 
});

/* --- 1. BACKGROUND CANVAS STARDUST --- */
const canvasBg = document.getElementById('stardust');
const ctxBg = canvasBg.getContext('2d');
canvasBg.width = window.innerWidth;
canvasBg.height = window.innerHeight;

let particlesBg = [];
class BgParticle {
    constructor() {
        this.x = Math.random() * canvasBg.width;
        this.y = Math.random() * canvasBg.height;
        this.size = Math.random() * 2 + 0.5;
        this.speedX = Math.random() * 1 - 0.5;
        this.speedY = Math.random() * 1 - 0.5;
        this.opacity = Math.random() * 0.5 + 0.1;
    }
    update() {
        this.x += this.speedX;
        this.y += this.speedY;
        if (this.size > 0.2) this.size -= 0.01;
        if (this.x < 0 || this.x > canvasBg.width) this.speedX *= -1;
        if (this.y < 0 || this.y > canvasBg.height) this.speedY *= -1;
    }
    draw() {
        ctxBg.fillStyle = `rgba(255, 215, 0, ${this.opacity})`;
        ctxBg.beginPath();
        ctxBg.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctxBg.fill();
    }
}
function initBgCanvas() {
    particlesBg = [];
    for (let i = 0; i < 80; i++) { particlesBg.push(new BgParticle()); }
}
function animateBgCanvas() {
    ctxBg.clearRect(0, 0, canvasBg.width, canvasBg.height);
    for (let i = 0; i < particlesBg.length; i++) {
        particlesBg[i].update();
        particlesBg[i].draw();
    }
    requestAnimationFrame(animateBgCanvas);
}
initBgCanvas();
animateBgCanvas();

/* --- 2. FOREGROUND SUBTLE STAR SPRINKLER EFFECT --- */
const canvasSprinkle = document.getElementById('sprinkler-canvas');
const ctxSprinkle = canvasSprinkle.getContext('2d');

function resizeSprinkler() {
    canvasSprinkle.width = canvasSprinkle.offsetWidth;
    canvasSprinkle.height = canvasSprinkle.offsetHeight;
}
window.addEventListener('resize', resizeSprinkler);
setTimeout(resizeSprinkler, 100);

let sprinkleParticles = [];
class StarSparkle {
    constructor() {
        this.x = (canvasSprinkle.width * 0.2) + Math.random() * (canvasSprinkle.width * 0.6);
        this.y = (canvasSprinkle.height * 0.2) + Math.random() * (canvasSprinkle.height * 0.6);
        
        this.size = Math.random() * 2 + 1; 
        
        this.speedX = (Math.random() - 0.5) * 2; 
        this.speedY = (Math.random() * -2.5) - 0.5; 
        this.gravity = 0.05;
        this.rotation = Math.random() * Math.PI * 2;
        this.rotationSpeed = (Math.random() - 0.5) * 0.15;
        
        this.opacity = Math.random() * 0.5 + 0.3; 
        this.color = Math.random() > 0.3 ? 'rgba(255, 215, 0, 0.8)' : 'rgba(255, 255, 255, 0.8)'; 
    }
    update() {
        this.speedY += this.gravity; 
        this.x += this.speedX;
        this.y += this.speedY;
        this.rotation += this.rotationSpeed;
        this.opacity -= 0.012; 
    }
    draw() {
        ctxSprinkle.save(); 
        ctxSprinkle.translate(this.x, this.y);
        ctxSprinkle.rotate(this.rotation);
        
        ctxSprinkle.fillStyle = this.color;
        ctxSprinkle.globalAlpha = Math.max(0, this.opacity);
        
        ctxSprinkle.shadowBlur = 2; 
        ctxSprinkle.shadowColor = this.color;
        
        const spikes = 4;
        const outerRadius = this.size;
        const innerRadius = this.size * 0.3;
        let rot = Math.PI / 2 * 3;
        const step = Math.PI / spikes;

        ctxSprinkle.beginPath();
        ctxSprinkle.moveTo(0, 0 - outerRadius);
        for (let i = 0; i < spikes; i++) {
            ctxSprinkle.lineTo(Math.cos(rot) * outerRadius, Math.sin(rot) * outerRadius);
            rot += step;
            ctxSprinkle.lineTo(Math.cos(rot) * innerRadius, Math.sin(rot) * innerRadius);
            rot += step;
        }
        ctxSprinkle.lineTo(0, 0 - outerRadius);
        ctxSprinkle.closePath();
        ctxSprinkle.fill();
        ctxSprinkle.restore(); 
    }
}

function animateSprinkler() {
    ctxSprinkle.clearRect(0, 0, canvasSprinkle.width, canvasSprinkle.height);
    
    if (Math.random() < 0.15) { 
        sprinkleParticles.push(new StarSparkle());
    }
    
    for (let i = 0; i < sprinkleParticles.length; i++) {
        sprinkleParticles[i].update();
        sprinkleParticles[i].draw();
        if (sprinkleParticles[i].opacity <= 0) {
            sprinkleParticles.splice(i, 1);
            i--;
        }
    }
    requestAnimationFrame(animateSprinkler);
}
animateSprinkler();

/* --- 3. SWIPING COUNTDOWN LOGIC --- */
const weddingDate = new Date("November 25, 2026 00:00:00").getTime();
function pad(n) { return n < 10 ? "0" + n : n; }

function updateTimeWithSwipe(id, newValue) {
    const el = document.getElementById(id);
    if (el.innerText !== newValue.toString()) {
        el.classList.add('swipe-down');
        setTimeout(() => {
            el.innerText = newValue;
        }, 200); 
        setTimeout(() => {
            el.classList.remove('swipe-down');
        }, 400); 
    }
}

setInterval(() => {
    const now = new Date().getTime();
    const gap = weddingDate - now;
    if (gap < 0) return;
    
    const d = pad(Math.floor(gap / (1000 * 60 * 60 * 24)));
    const h = pad(Math.floor((gap % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)));
    const m = pad(Math.floor((gap % (1000 * 60 * 60)) / (1000 * 60)));
    const s = pad(Math.floor((gap % (1000 * 60)) / 1000));

    updateTimeWithSwipe("days", d);
    updateTimeWithSwipe("hours", h);
    updateTimeWithSwipe("minutes", m);
    updateTimeWithSwipe("seconds", s);
}, 1000);

/* --- AUDIO TOGGLE --- */
const audioBtn = document.getElementById('audio-toggle');
const bgMusic = document.getElementById('bg-music');
const iconPlay = document.getElementById('icon-play');
const iconPause = document.getElementById('icon-pause');
let isPlaying = false;
audioBtn.addEventListener('click', () => {
    if (isPlaying) { bgMusic.pause(); iconPlay.style.display = 'block'; iconPause.style.display = 'none'; } 
    else { bgMusic.play(); iconPlay.style.display = 'none'; iconPause.style.display = 'block'; }
    isPlaying = !isPlaying;
});
</script>
</body>
</html>
